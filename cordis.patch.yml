# Terminal agent preset: the coding tools plus the six persistent PTY tools.
#
# `@deepseek-ai/dsh-tool-terminal` is not part of the Desktop installation
# closure, so this bundle declares it as a dependency; installing the bundle
# with a `file:` spec puts it in the profile's node_modules, where the preset
# row below resolves it.
- insert:
    - id: preset-terminal
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: terminal
        name: Terminal
        description: 编码工具, 外加 6 个持久 PTY 终端工具 (terminal_open, terminal_send, terminal_read, terminal_signal, terminal_close, terminal_list).
        order: 20
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              suffix: Your working directory is {{cwd}}.
              prefix: You are a coding agent powered by the {{model}} model.
          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          # A preset that supplies a service must isolate the provider and its
          # consumers in one realm, or activation reports a leaked service.
          - id: pty
            name: cordis:group
            group: true
            isolate:
              terminals: true
            config:
              - id: pty-service
                name: '@deepseek-ai/dsh-terminal'
              - id: terminal-bash
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform === 'win32'
                config:
                  timeoutMs: 300000
              - id: terminal-pwsh
                name: '@deepseek-ai/dsh-terminal-bash'
                disabled: !!js process.platform !== 'win32'
                config:
                  shellDialect: pwsh
                  timeoutMs: 300000
              - id: tool-terminal
                name: '@deepseek-ai/dsh-tool-terminal'
